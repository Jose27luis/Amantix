<svg viewBox="0 0 240 180" class="ilustracion" role="img" [attr.aria-label]="'Ilustración de ' + tipo()">
  <defs>
    <linearGradient id="il-laton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CD97" />
      <stop offset="1" stop-color="#B0894F" />
    </linearGradient>
    <linearGradient id="il-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D9389" />
      <stop offset="1" stop-color="#2F6E68" />
    </linearGradient>
    <linearGradient id="il-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3F54" />
      <stop offset="1" stop-color="#0F1D2E" />
    </linearGradient>
  </defs>

  <circle cx="120" cy="92" r="78" fill="#EEF1F3" />
  <circle cx="120" cy="92" r="78" fill="none" stroke="#DCE2E6" stroke-dasharray="3 6" />

    @case ('facturacion') {
      <g class="flota">

        <rect x="74" y="88" width="52" height="5" rx="2.5" fill="#C4CED6" />

        <rect x="108" y="106" width="24" height="7" rx="3.5" fill="url(#il-laton)" />

      <g class="flota flota-lenta">
        <rect x="146" y="58" width="44" height="78" rx="9" fill="url(#il-navy)" />
        <rect x="151" y="66" width="34" height="56" rx="4" fill="#3D9389" />

      </g>
      <g class="sello">
        <circle cx="64" cy="124" r="20" fill="url(#il-teal)" />

        <path d="m56 124 5 5 10-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    }
    @case ('restaurante') {
      <g class="vapor">
        <path d="M100 50c-6-8 6-12 0-20" fill="none" stroke="#7FA8A3" stroke-width="3" stroke-linecap="round" />
        <path d="M116 46c-6-8 6-12 0-20" fill="none" stroke="#D8B77C" stroke-width="3" stroke-linecap="round" />
        <path d="M132 50c-6-8 6-12 0-20" fill="none" stroke="#7FA8A3" stroke-width="3" stroke-linecap="round" />

      <path d="M72 84h88c0 26-20 42-44 42S72 110 72 84Z" fill="url(#il-teal)" />

        <path d="M44 72v58M38 72v16c0 6 12 6 12 0V72" fill="none" stroke="#2A3F54" stroke-width="4" stroke-linecap="round" />

    @case ('agente') {

        <rect x="58" y="96" width="90" height="56" rx="10" fill="url(#il-navy)" transform="rotate(-8 103 124)" />

        <rect x="82" y="98" width="56" height="5" rx="2.5" fill="#0F1D2E" opacity="0.55" />

      <g class="flechas">
        <path d="M176 52h-30m0 0 8-8m-8 8 8 8" fill="none" stroke="#2F6E68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M190 66h30m0 0-8-8m8 8-8 8" fill="none" stroke="#B0894F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    }
    @default {
      <g class="flota">
        <rect x="70" y="58" width="56" height="86" rx="12" fill="url(#il-teal)" />
        <rect x="76" y="44" width="44" height="18" rx="5" fill="url(#il-navy)" />
        <rect x="78" y="80" width="40" height="34" rx="5" fill="#fff" />
        <path d="M98 87v20M88 97h20" stroke="#B0894F" stroke-width="5" stroke-linecap="round" />
      </g>
      <g class="flota flota-lenta">

        <rect x="160" y="130" width="20" height="14" rx="7" fill="#0F1D2E" transform="rotate(-20 160 137)" />
        <rect x="44" y="120" width="34" height="13" rx="6.5" fill="#2A3F54" transform="rotate(25 61 126)" />
        <rect x="44" y="120" width="17" height="13" rx="6.5" fill="#D8B77C" transform="rotate(25 61 126)" />
      </g>
    }
  }
</svg>
